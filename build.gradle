plugins {
    id 'java'
    id 'java-library'
}

group = 'com.openomada.plugin'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 3.4.8 (provided by Omada in production)
    compileOnly 'org.springframework.boot:spring-boot-starter-web:3.4.8'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-mongodb:3.4.8'
    compileOnly 'org.springframework.boot:spring-boot-starter-aop:3.4.8'
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // Testing dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-web:3.4.8'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb:3.4.8'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.4.8'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'omada-tr069-plugin'
    manifest {
        attributes(
            'Implementation-Title': 'OpenOmada TR-069 Native Plugin',
            'Implementation-Version': project.version,
            'Built-By': 'OpenOmada Team'
        )
    }
}
